name: eval gate

# PRs only. Pushes to main are gated inside deploy.yml, where the deploy job
# declares `needs: gate` - so main is checked there and there is no duplicate
# run (and no false sense of safety from a gate that is not wired to anything).
#
# Make this job a REQUIRED STATUS CHECK in branch protection, and require pull
# requests into main. Then a change that fails cannot even be merged, which is
# the layer that actually protects you.
on:
  pull_request:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: run tests
        run: python -m pytest -q
      - name: run eval gate
        run: python -m evals.run_evals

      - name: smoke test the rate limit under concurrency
        run: |
          # Week 07: a rate limit you have not tested under load is a guess.
          # Boots the real app with a fake model, floods it, and asserts the
          # limit actually held. No API key needed.
          PYTHONPATH=. python -m loadtest.fake_server --port 8099 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            curl -sf --max-time 2 http://127.0.0.1:8099/health >/dev/null && break
            sleep 1
          done
          python -m loadtest.run_load --url http://127.0.0.1:8099 \
            --n 50 --concurrency 10 | tee load.txt
          kill $SERVER_PID
          grep -q "429" load.txt \
            || { echo "the rate limit did not hold under load"; exit 1; }
        env:
          RATE_LIMIT_PER_MIN: "30"

