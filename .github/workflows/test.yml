name: tests

# Pull requests only. Pushes to main are covered inside deploy.yml, where the
# deploy job declares `needs: test` - so main is checked there and there is no
# duplicate run, and no false sense of safety from a check that is not wired to
# anything.
#
# Make this job a REQUIRED STATUS CHECK in branch protection, and require pull
# requests into main. Then a change that fails cannot even be merged, which is
# the layer that actually protects you. A workflow that only reports is a
# workflow people learn to ignore.
on:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: run tests
        run: python -m pytest -q
      - name: run the weekly checkpoints
        run: |
          python -m checks.check 00
          python -m checks.check 01
          python -m checks.check 02
          python -m checks.check 03
          python -m checks.check 04
          python -m checks.check 05
