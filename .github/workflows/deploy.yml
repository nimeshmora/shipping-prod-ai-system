name: deploy

on:
  push:
    branches: [main]

# One workflow, two jobs, one arrow between them.
#
# `deploy` declares `needs: gate`, so GitHub will not start it until the gate
# job has finished successfully. A failing gate means the deploy never runs.
#
# This is the thing to get right: two SEPARATE workflows both triggered by
# `push: main` do NOT gate each other. They race. `needs:` only works between
# jobs inside one workflow, which is why the gate lives here.
#
# In a real repo you would also protect main: require the gate as a status
# check and require pull requests, so a bad commit cannot reach main at all.
# That lives in repo settings, not in this file. Both layers are worth having.

# Never let two deploys of the same branch overlap; a slow older run must not
# land on top of a newer one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- the gate
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: run tests
        run: python -m pytest -q
      - name: run eval gate
        run: python -m evals.run_evals

      - name: smoke test the rate limit under concurrency
        run: |
          # Week 07: a rate limit you have not tested under load is a guess.
          # Boots the real app with a fake model, floods it, and asserts the
          # limit actually held. No API key needed.
          PYTHONPATH=. python -m loadtest.fake_server --port 8099 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            curl -sf --max-time 2 http://127.0.0.1:8099/health >/dev/null && break
            sleep 1
          done
          python -m loadtest.run_load --url http://127.0.0.1:8099 \
            --n 50 --concurrency 10 | tee load.txt
          kill $SERVER_PID
          grep -q "429" load.txt \
            || { echo "the rate limit did not hold under load"; exit 1; }
        env:
          RATE_LIMIT_PER_MIN: "30"

  # --------------------------------------------------------------- the deploy
  deploy:
    needs: gate                # <-- the arrow. No gate, no deploy.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Tag the revision with the commit SHA so you can roll back to a
      # specific commit later instead of guessing which revision was good.
      - name: deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ship-agent \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --revision-suffix "${GITHUB_SHA::7}" \
            --set-env-vars "MODEL=claude-sonnet-5,BASE_URL=https://api.ai.kodekloud.com/v1,RATE_LIMIT_PER_MIN=20" \
            --set-secrets "KODEKEY=kodekey:latest" \
            --timeout=3600 --concurrency=80 --min-instances=1

      # A deploy that exits 0 is not the same as a service that answers.
      - name: verify the service is really up
        run: |
          URL=$(gcloud run services describe ship-agent \
                  --region us-central1 --format='value(status.url)')
          echo "deployed to $URL"
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "$URL/health" | grep -q '"ok"'; then
              echo "health check passed"
              exit 0
            fi
            echo "  not ready yet, retrying ($i/10)"
            sleep 6
          done
          echo "health check FAILED - rolling back to the previous revision"
          PREV=$(gcloud run revisions list --service ship-agent \
                   --region us-central1 --format='value(name)' \
                   --sort-by=~metadata.creationTimestamp | sed -n 2p)
          if [ -n "$PREV" ]; then
            gcloud run services update-traffic ship-agent \
              --region us-central1 --to-revisions "$PREV=100"
            echo "rolled back to $PREV"
          fi
          exit 1
